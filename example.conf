# Example configuration with multiple server blocks

server {
    listen 127.0.0.1:8080;
    root ./www;
    index index.html;
    autoindex on;
    client_max_body_size 10M;

    error_page 404 /404.html;
    error_page 500 /500.html;

    location / {
        allow_methods GET POST;
    }

    location /upload {
        allow_methods POST;
        upload on;
        upload_store ./uploads;
    }

    location /api {
        allow_methods GET POST DELETE;
    }
}

server {
    listen 127.0.0.1:8081;
    root ./www2;
    index index.html;
    autoindex off;
    client_max_body_size 5M;

    location / {
        allow_methods GET;
    }
}
