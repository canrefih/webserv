server {
    listen 127.0.0.1:8080;

    root ./www;
    client_max_body_size 200000000;

    location / {
        allow_methods GET;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
        upload on;
        upload_store ./www/uploads;
    }

    location /uploads {
        allow_methods GET DELETE;
    }

    location /cgi-bin {
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
    }

    location /directory {
        root ./YoupiBanane;
        allow_methods GET POST;
        index youpi.bad_extension;
        autoindex off;
        cgi_extension .bla ./config/cgi_tester virtual;
    }

    location /directory/ {
        root ./YoupiBanane;
        allow_methods GET POST;
        index youpi.bad_extension;
        autoindex off;
        cgi_extension .bla ./config/cgi_tester virtual;
    }

    location /youpi.bla {
        allow_methods POST;
        root ./YoupiBanane;
        cgi_extension .bla ./config/cgi_tester virtual;
    }
}