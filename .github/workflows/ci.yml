name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server
        run: make

      - name: Build tests
        working-directory: tests
        run: ./compile_tests.sh

      - name: Run tests
        working-directory: tests
        run: ./run_all_tests.sh
